<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Jain symbol">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbeede"/>
      <stop offset="1" stop-color="#f3dcc0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Jain Prateek Chihna, brand orange -->
  <g transform="translate(256 258) scale(0.86) translate(-256 -256)"
     fill="none" stroke="#c15a1e" stroke-width="9"
     stroke-linejoin="round" stroke-linecap="round">

    <!-- Loka (cosmic person) outline -->
    <path d="M181 88
             L331 88
             L392 232
             L322 300
             L392 452
             L120 452
             L190 300
             L120 232
             Z"/>

    <!-- Crescent (opens downward) + bindu above it -->
    <path d="M206 92 a52 34 0 0 1 100 0"/>
    <circle cx="256" cy="70" r="7" fill="#c15a1e" stroke="none"/>

    <!-- Three dots (Ratnatraya) -->
    <circle cx="220" cy="126" r="8" fill="#c15a1e" stroke="none"/>
    <circle cx="256" cy="126" r="8" fill="#c15a1e" stroke="none"/>
    <circle cx="292" cy="126" r="8" fill="#c15a1e" stroke="none"/>

    <!-- Swastika (upper compartment), clockwise -->
    <path stroke-width="15" stroke-linecap="butt" stroke-linejoin="miter"
          d="M256 174 V234 M226 204 H286
             M256 174 H282 M286 204 V230 M256 234 H230 M226 204 V178"/>

    <!-- Ahimsa hand (lower compartment), fingers separated -->
    <g stroke-width="8">
      <path d="M212 424
               V326
               q0 -8 8 -8 q8 0 8 8
               V308 q0 -9 8 -9 q8 0 8 9
               V304 q0 -9 8 -9 q8 0 8 9
               V320 q0 -8 8 -8 q8 0 8 8
               V424 Z"/>
      <!-- Dharmachakra on the palm -->
      <circle cx="256" cy="392" r="30"/>
      <circle cx="256" cy="392" r="9"/>
      <g stroke-width="4">
        <line x1="256" y1="362" x2="256" y2="422"/>
        <line x1="226" y1="392" x2="286" y2="392"/>
        <line x1="234.9" y1="370.9" x2="277.1" y2="413.1"/>
        <line x1="277.1" y1="370.9" x2="234.9" y2="413.1"/>
        <line x1="240.5" y1="364.7" x2="271.5" y2="419.3"/>
        <line x1="271.5" y1="364.7" x2="240.5" y2="419.3"/>
        <line x1="228.7" y1="376.5" x2="283.3" y2="407.5"/>
        <line x1="283.3" y1="376.5" x2="228.7" y2="407.5"/>
      </g>
    </g>
  </g>
</svg>
